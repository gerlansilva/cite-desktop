name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build PDF assets
        run: npm run build:assets

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Test JavaScript
        run: npm run test:data

      - name: Build app
        run: npm run build

      - name: Upload bundles
        uses: actions/upload-artifact@v5
        with:
          name: cite-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publicar na release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          body: |
            Instaladores do Cite para macOS (.dmg, Apple Silicon) e Windows (.exe).
            O app do Mac tem assinatura ad hoc (gratuita), sem certificado da Apple:
            na primeira abertura, clique com o botão direito e escolha Abrir.

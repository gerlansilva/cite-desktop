<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cite</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root { color-scheme: light; --accent: #1f6f5c; --line: #d9dee5; --muted: #68727f; --text: #222a33; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 14px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--text); background: #fff; }
    h1 { font-size: 16px; margin: 0 0 2px; }
    .muted { color: var(--muted); font-size: 11px; }
    .row { display: flex; gap: 6px; margin-top: 9px; }
    input, select, button { font: inherit; }
    input, select { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 5px; background: #fff; }
    button { border: 1px solid var(--line); border-radius: 5px; background: #fff; padding: 7px 10px; cursor: pointer; white-space: nowrap; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    .card { border: 1px solid var(--line); border-radius: 7px; padding: 10px; margin-top: 10px; }
    .item { border-bottom: 1px solid #eef1f4; padding: 8px 0; cursor: pointer; }
    .item:last-child { border-bottom: 0; }
    .item:hover, .item.selected { background: #f3f8f6; }
    .item strong { display: block; font-size: 12.5px; }
    .item span { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    #list { max-height: 46vh; overflow: auto; }
    #preview { min-height: 54px; }
    .actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    #status { min-height: 17px; margin-top: 8px; color: var(--muted); font-size: 11px; }
    code { font-size: 10.5px; }
  </style>
</head>
<body>
  <h1>Cite</h1>
  <div class="muted">Citações da sua biblioteca no Word.</div>

  <div class="card">
    <label class="muted" for="bibliography-url">URL do bibliography.json</label>
    <input id="bibliography-url" placeholder="https://raw.githubusercontent.com/.../bibliography.json">
    <div class="row">
      <select id="style" aria-label="Estilo"></select>
      <button id="load">Carregar</button>
    </div>
    <div id="status"></div>
  </div>

  <div class="row">
    <input id="search" placeholder="Buscar por título, autor ou ano" autocomplete="off">
  </div>
  <div id="list" class="card"><div class="muted">Carregue uma bibliografia para começar.</div></div>

  <div class="card">
    <div class="muted">Citação selecionada</div>
    <div id="preview">Nenhuma referência selecionada.</div>
    <div class="actions">
      <button id="insert-citation" class="primary" disabled>Inserir citação</button>
      <button id="insert-bibliography" disabled>Inserir bibliografia</button>
    </div>
  </div>

  <script src="./taskpane.js"></script>
</body>
</html>

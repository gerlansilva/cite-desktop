[package]
name = "cite"
version = "0.3.9"
description = "Gerenciador de referências local inspirado no Paperpile"
authors = ["Cite"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "cite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
flate2 = "1"
base64 = "0.22"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "native-tls", "charset", "http2"] }

[target.'cfg(target_os = "macos")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

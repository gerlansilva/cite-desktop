    #main { flex: 1; min-width: 0; overflow: auto; background: #f2f4f6; position: relative; }

      position: absolute; white-space: pre; transform-origin: 0 0; cursor: text; color: transparent;
      --scale-x: 1; --rotate: 0deg;
      font-size: calc(var(--text-scale-factor) * var(--font-height));
      transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv));

    /* Cite identity */

        </div>
        <div class="menu-sep"></div>
        <button class="menu-item" id="text-place"><svg class="icon mi-icon"><use href="#i-text"/></svg><span class="mi-label">Inserir texto no PDF</span><span class="shortcut">T</span></button>
      </div>
    </div>

    <div class="tool-group">
      <button class="color-button" id="color-button" title="Cor da anotação" aria-label="Cor da anotação"><span id="color-swatch"></span></button>
      <div class="menu" id="color-menu" hidden>
        <div class="swatches">
          <button class="swatch selected" data-color="#ffe268" style="background:#ffe268" aria-label="Amarelo"></button>
          <button class="swatch" data-color="#a7e8a7" style="background:#a7e8a7" aria-label="Verde"></button>
          <button class="swatch" data-color="#9ed7f7" style="background:#9ed7f7" aria-label="Azul"></button>
          <button class="swatch" data-color="#f7b6d2" style="background:#f7b6d2" aria-label="Rosa"></button>
          <button class="swatch" data-color="#f6b26b" style="background:#f6b26b" aria-label="Laranja"></button>
          <button class="swatch" data-color="#d9c2f0" style="background:#d9c2f0" aria-label="Roxo"></button>
          <button class="swatch" data-color="#ff9b9b" style="background:#ff9b9b" aria-label="Vermelho"></button>
          <button class="swatch" data-color="#b9e4d0" style="background:#b9e4d0" aria-label="Menta"></button>
          <button class="swatch" data-color="#d7dde5" style="background:#d7dde5" aria-label="Cinza"></button>
          <button class="swatch" data-color="#ffffff" style="background:#fff" aria-label="Branco"></button>
        </div>
      </div>
    </div>

    <div class="tb-sep"></div>
    <div id="findbar">
      <svg class="icon sm"><use href="#i-search"/></svg>
      <input id="find-input" placeholder="Buscar no PDF" aria-label="Buscar no PDF">
      <span id="find-count">0 resultados</span>
      <button id="find-prev" title="Ocorrência anterior" aria-label="Ocorrência anterior"><svg class="icon sm"><use href="#i-prev"/></svg></button>
      <button id="find-next" title="Próxima ocorrência" aria-label="Próxima ocorrência"><svg class="icon sm"><use href="#i-next"/></svg></button>
    </div>

    <div class="tb-spacer"></div>
    <button class="tb-btn" id="back-home" title="Voltar à biblioteca" aria-label="Voltar à biblioteca"><svg class="icon"><use href="#i-back"/></svg><span>Biblioteca</span></button>
    <button class="tb-btn" id="show-annotations" title="Painel de anotações" aria-label="Painel de anotações"><svg class="icon"><use href="#i-panel"/></svg></button>
    <button class="tb-btn" id="download-button" title="Abrir no visualizador padrão" aria-label="Abrir no visualizador padrão"><svg class="icon"><use href="#i-download"/></svg></button>
    <button class="tb-btn" id="settings-button" title="Configurações" aria-label="Configurações"><svg class="icon"><use href="#i-settings"/></svg></button>
    <button class="tb-btn" id="more-button" title="Mais opções" aria-label="Mais opções"><svg class="icon"><use href="#i-dots"/></svg></button>

    <div class="menu right" id="settings-menu" hidden>
      <div class="menu-title">Arquivo</div>
      <button class="menu-item" id="show-in-cite"><svg class="icon mi-icon"><use href="#i-page"/></svg><span class="mi-label">Mostrar no Cite</span></button>
      <button class="menu-item" id="open-external"><svg class="icon mi-icon"><use href="#i-download"/></svg><span class="mi-label">Abrir no visualizador padrão</span><span class="shortcut">⌘D</span></button>
      <div class="menu-sep"></div>
      <div class="menu-title">Configurações</div>
      <button class="menu-item active" id="light-theme"><svg class="icon mi-icon"><use href="#i-sun"/></svg><span class="mi-label">Tema claro</span></button>
      <button class="menu-item" id="dark-theme"><svg class="icon mi-icon"><use href="#i-moon"/></svg><span class="mi-label">Tema escuro</span></button>
      <button class="menu-item" id="viewer-settings"><svg class="icon mi-icon"><use href="#i-panel"/></svg><span class="mi-label">Alterar visualizador padrão</span></button>
      <div class="menu-sep"></div>
      <button class="menu-item" id="help-item"><svg class="icon mi-icon"><use href="#i-help"/></svg><span class="mi-label">Ajuda</span><span class="shortcut">?</span></button>
      <button class="menu-item" id="shortcuts-item"><span class="mi-label">Atalhos do teclado</span><span class="shortcut">?</span></button>
    </div>

    <div class="menu right" id="more-menu" hidden>
      <button class="menu-item" id="export-annotations"><svg class="icon mi-icon"><use href="#i-download"/></svg><span class="mi-label">Exportar anotações</span></button>
      <div class="menu-sep"></div>
      <button class="menu-item" id="menu-find"><svg class="icon mi-icon"><use href="#i-search"/></svg><span class="mi-label">Buscar no documento</span><span class="shortcut">⌘F</span></button>
      <div class="menu-sep"></div>
      <button class="menu-item" id="zoom-in"><span class="mi-label">Aumentar zoom</span><span class="shortcut">+</span></button>
      <button class="menu-item" id="zoom-out"><span class="mi-label">Diminuir zoom</span><span class="shortcut">−</span></button>
      <button class="menu-item" id="zoom-auto"><span class="mi-label">Automático</span><span class="shortcut">⌘0</span></button>
      <button class="menu-item" id="page-fit"><span class="mi-label">Ajustar à página</span><span class="shortcut">⌘1</span></button>
      <button class="menu-item" id="page-width"><span class="mi-label">Largura da página</span><span class="shortcut">⌘2</span></button>
      <div class="menu-sep"></div>
      <button class="menu-item" id="rotate-right"><svg class="icon mi-icon"><use href="#i-rotate"/></svg><span class="mi-label">Girar para a direita</span><span class="shortcut">⌘R</span></button>
      <button class="menu-item" id="rotate-left"><svg class="icon mi-icon"><use href="#i-rotate"/></svg><span class="mi-label">Girar para a esquerda</span><span class="shortcut">⌘⇧R</span></button>
      <div class="menu-sep"></div>
      <button class="menu-item" id="go-page"><span class="mi-label">Ir para página</span><span class="shortcut">⌘G</span></button>
    </div>
  </header>

  <div id="app">
    <aside id="annotations" aria-label="Anotações">
      <div class="panel-tools">
        <button class="active" title="Lista de anotações" aria-label="Lista de anotações"><svg class="icon sm"><use href="#i-list"/></svg></button>
        <button title="Miniaturas" aria-label="Miniaturas"><svg class="icon sm"><use href="#i-grid"/></svg></button>
        <span class="grow"></span>
        <button id="hide-annotations" title="Recolher painel" aria-label="Recolher anotações"><svg class="icon sm"><use href="#i-collapse"/></svg></button>
      </div>
      <div class="ann-head">
        <strong>Anotações</strong><span class="count" id="ann-count"></span>
        <div class="head-actions">
          <button id="export-annotations-button" title="Exportar anotações" aria-label="Exportar anotações"><svg class="icon sm"><use href="#i-download"/></svg></button>
          <button id="ann-search-toggle" title="Buscar anotações" aria-label="Buscar anotações"><svg class="icon sm"><use href="#i-search"/></svg></button>
        </div>
      </div>
      <input id="ann-search" placeholder="Buscar anotações" aria-label="Buscar anotações">
      <div id="ann-list"></div>
    </aside>
    <main id="main">
      <div id="pages"></div>
    </main>
    <aside id="comments-panel" aria-label="Comentários">
      <div class="comments-head">
        <strong>Comentários</strong><span id="comments-count"></span>
        <button id="collapse-comments" title="Recolher comentários" aria-label="Recolher comentários"><svg class="icon sm"><use href="#i-collapse-right"/></svg></button>
      </div>
      <div id="comment-cards"></div>
    </aside>
  </div>

  <div id="selection-actions">
    <button id="hl-button" type="button">Destacar</button>
    <button id="underline-button" type="button">Sublinhar</button>
    <button id="strike-button" type="button">Tachar</button>
    <button id="comment-button" type="button">Comentar</button>
    <button id="translate-selection" type="button" title="Traduzir trecho" aria-label="Traduzir trecho">Traduzir</button>
    <button id="copy-selection" type="button" title="Copiar com página" aria-label="Copiar com página">Copiar</button>
  </div>

  <div id="translation-panel" hidden>
    <div class="tr-head">
      <strong>Tradução</strong>
      <select id="translation-target" aria-label="Idioma de destino">
        <option value="pt">Português</option>
        <option value="tet">Tetum Dili</option>
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
      <button id="close-translation" type="button" title="Fechar tradução" aria-label="Fechar tradução">×</button>
    </div>
    <p id="translation-source" class="tr-source"></p>
    <p id="translation-result" class="tr-result" aria-live="polite"></p>
    <div class="tr-actions">
      <button id="copy-translation" type="button">Copiar tradução</button>
    </div>
  </div>

  <div id="comment-editor" tabindex="-1" hidden>
    <button id="comment-menu-button" type="button" title="Opções do comentário" aria-label="Opções do comentário"><svg class="icon sm"><use href="#i-dots"/></svg></button>
    <p class="editor-title">Comentário</p>
    <textarea id="comment-text" placeholder="Adicionar comentário"></textarea>
    <div class="editor-actions">
      <button id="comment-cancel" type="button">Cancelar</button>
      <button id="comment-save" type="button">Salvar</button>
    </div>
    <div id="comment-menu" hidden>
      <button type="button" class="comment-menu-item" id="comment-reply"><svg class="icon sm"><use href="#i-message"/></svg><span>Responder</span></button>
      <div class="comment-menu-sep"></div>
      <button type="button" class="comment-menu-item comment-color" data-color="#ffe268"><span class="color-dot" style="background:#ffe268"></span><span>Amarelo</span><span class="shortcut">1</span><span class="check">✓</span></button>
      <button type="button" class="comment-menu-item comment-color" data-color="#f7b6d2"><span class="color-dot" style="background:#f7b6d2"></span><span>Rosa</span><span class="shortcut">2</span><span class="check">✓</span></button>
      <button type="button" class="comment-menu-item comment-color" data-color="#9ed7f7"><span class="color-dot" style="background:#9ed7f7"></span><span>Azul</span><span class="shortcut">3</span><span class="check">✓</span></button>
      <button type="button" class="comment-menu-item comment-color" data-color="#a7e8a7"><span class="color-dot" style="background:#a7e8a7"></span><span>Verde</span><span class="shortcut">4</span><span class="check">✓</span></button>
      <div class="comment-menu-sep"></div>
      <button type="button" class="comment-menu-item danger" id="comment-delete" hidden><svg class="icon sm"><use href="#i-x"/></svg><span>Remover</span></button>
    </div>
  </div>

  <div id="text-editor" hidden>
    <p class="editor-title">Inserir texto</p>
    <textarea id="text-editor-input" placeholder="Digite o texto…"></textarea>
    <div class="editor-actions">
      <button id="text-cancel" type="button">Cancelar</button>
      <button id="text-save" type="button">Adicionar</button>
    </div>
  </div>

  <div id="status-toast"></div>
  <script src="./i18n.js"></script>
  <script src="./pdf-viewer.bundle.js"></script>
</body>
</html>
